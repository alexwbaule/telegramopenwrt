# Workflow do Gitea Actions: compila o pacote telegram-openwrt como .apk
# usando o SDK pre-compilado do OpenWrt (baixado de downloads.openwrt.org),
# em vez de clonar e compilar o buildroot inteiro do zero. O SDK ja vem com
# toolchain e ferramentas de host prontas, o que evita ter que compilar
# gcc/libs do zero a cada build (muito mais rapido) e evita depender de
# variaveis de ambiente para selecionar o target (o SDK ja e fixo para uma
# arquitetura). Documentacao oficial: https://openwrt.org/docs/guide-developer/start
#
# Requisitos no lado do Gitea:
# - Um runner (act_runner) registrado, com a label usada em "runs-on" abaixo
#   (ajuste se o seu runner usa outra label).
# - O runner precisa resolver "uses: actions/checkout@v4" e
#   "actions/upload-artifact@v4". Por padrao o Gitea resolve nomes curtos
#   "actions/*" contra https://gitea.com (config [actions] DEFAULT_ACTIONS_URL),
#   que hospeda mirrors dessas actions. Se sua instancia estiver sem acesso
#   a internet, troque para "uses: https://SEU_GITEA/actions/checkout@v4"
#   apontando para mirrors locais.
# - upload-artifact@v4 requer runner >= v4.4.0 (artifacts nativos do Gitea).
# - O runner precisa de acesso a downloads.openwrt.org para baixar o SDK.

name: Build telegram-openwrt (apk)

on:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'Versao de release do OpenWrt (ex: 25.12.0) ou "snapshot"'
        required: true
        default: '25.12.0'

# Necessario para o step de release (abaixo) poder criar releases e subir
# o .apk como anexo quando o push for de uma tag.
permissions:
  contents: write

env:
  PACKAGE_NAME: telegram-openwrt
  # Pacote e PKGARCH:=all (so shell scripts), entao o SDK/arquitetura
  # escolhido aqui so precisa ser valido para gerar um ambiente de build;
  # o .apk resultante roda em qualquer arquitetura.
  SDK_BOARD: x86
  SDK_SUBTARGET: '64'

jobs:
  build_apk:
    name: Build telegram-openwrt .apk (${{ inputs.openwrt_version || '25.12.0' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout telegram-openwrt package repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison gawk gettext \
            libncurses5-dev libssl-dev python3 rsync \
            unzip zlib1g-dev zstd file wget ca-certificates

      - name: Download OpenWrt SDK (${{ inputs.openwrt_version || '25.12.0' }})
        run: |
          VERSION="${{ inputs.openwrt_version || '25.12.0' }}"
          if [ "${VERSION}" = "snapshot" ]; then
            BASE_URL="https://downloads.openwrt.org/snapshots/targets/${SDK_BOARD}/${SDK_SUBTARGET}"
          else
            BASE_URL="https://downloads.openwrt.org/releases/${VERSION}/targets/${SDK_BOARD}/${SDK_SUBTARGET}"
          fi
          echo "Procurando SDK em ${BASE_URL} ..."
          SUMS_FILE="$(mktemp)"
          curl -fsSL -o "${SUMS_FILE}" "${BASE_URL}/sha256sums"
          SDK_FILE="$(grep -o 'openwrt-sdk-[^ *]*\.tar\.zst' "${SUMS_FILE}" | head -n1)"
          if [ -z "${SDK_FILE}" ]; then
            echo "::error::Nao encontrei um SDK tarball em ${BASE_URL}"
            exit 1
          fi
          echo "Baixando ${SDK_FILE} ..."
          curl -fsSL -o "${SDK_FILE}" "${BASE_URL}/${SDK_FILE}"
          echo "Verificando checksum..."
          grep "${SDK_FILE}" "${SUMS_FILE}" | sha256sum -c -
          mkdir -p openwrt_sdk
          tar --use-compress-program=unzstd -xf "${SDK_FILE}" -C openwrt_sdk --strip-components=1

      - name: Update and install feeds
        working-directory: openwrt_sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Drop package into the SDK tree
        run: |
          mkdir -p openwrt_sdk/package/${PACKAGE_NAME}
          cp -R "${GITHUB_WORKSPACE}"/{Makefile,etc,sbin,usr} openwrt_sdk/package/${PACKAGE_NAME}/
          ls -lA openwrt_sdk/package/${PACKAGE_NAME}

      - name: Generate .config
        working-directory: openwrt_sdk
        run: |
          # Simbolos CONFIG_PACKAGE_* do OpenWrt preservam hifen (ex:
          # CONFIG_PACKAGE_libustream-openssl), entao NAO convertemos para
          # underscore aqui.
          CONFIG_PKG_NAME="CONFIG_PACKAGE_${PACKAGE_NAME}"
          echo "${CONFIG_PKG_NAME}=m" > .config
          make defconfig
          echo "Selecao do pacote no .config final:"
          grep "${CONFIG_PKG_NAME}" .config

      - name: Compile the package
        working-directory: openwrt_sdk
        run: make package/${PACKAGE_NAME}/compile V=s -j"$(nproc)"

      - name: Locate generated .apk
        working-directory: openwrt_sdk
        run: |
          echo "Arquivos .apk gerados:"
          find bin/packages -name "${PACKAGE_NAME}*.apk" -print
          find bin/packages -name "${PACKAGE_NAME}*.apk" -print -quit | grep -q . \
            || { echo "::error::Nenhum .apk gerado para ${PACKAGE_NAME}"; exit 1; }

      - name: Upload .apk artifact
        # v4+ do @actions/artifact se recusa a rodar em instancias detectadas
        # como GHES (o que inclui o Gitea, dependendo da versao/runner) com
        # "GHESNotSupportedError". v3 usa o backend antigo, sem essa checagem,
        # e funciona no Gitea. (No GitHub.com isso nao seria necessario, mas
        # v3 la ja foi desativado - por isso o workflow do GitHub usa v4.)
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.PACKAGE_NAME }}-apk-${{ inputs.openwrt_version || '25.12.0' }}
          path: openwrt_sdk/bin/packages/*/*/${{ env.PACKAGE_NAME }}*.apk
          if-no-files-found: error

      # So roda quando o workflow foi disparado por um push de tag
      # (ex: "git tag v1.1.1 && git push gitea v1.1.1"). softprops/action-gh-release
      # fala a API do Gitea tambem (nao so github.com), cria ou atualiza a
      # release da tag e sobe o .apk como anexo.
      - name: Publish Release with .apk
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: telegram-openwrt ${{ github.ref_name }}
          files: openwrt_sdk/bin/packages/*/*/${{ env.PACKAGE_NAME }}*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
